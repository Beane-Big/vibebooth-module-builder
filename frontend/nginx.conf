server {
    listen 80;
    root /usr/share/nginx/html;

    # 单页应用：/apps/builder/ 下的其他路径都返回 index.html。
    location /apps/builder/ {
        try_files $uri /apps/builder/index.html;
    }

    location /apps/builder/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
